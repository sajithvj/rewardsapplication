spring.application.name=rewards-application
server.port=8080
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.info.env.enabled=true
info.app.name=Rewards Application
info.app.description=Project used for Rewards Application Integration
info.app.version=1.0.0
info.app.developer=Sajith V J
## H2 DB DataBase Configurations ###
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;REFERENTIAL_INTEGRITY=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false
##spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

